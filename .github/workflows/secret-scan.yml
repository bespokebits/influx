# Thin caller for the org's secret scan (bespokebits/org-workflows; the reusable
# workflow's header documents it). Copy unchanged into .github/workflows/secret-scan.yml,
# including into the private source of a dual repo. On a pull request it runs gitleaks
# over the pull request's own commits and instructions-check on its head tree, as the
# checks `secret-scan / gitleaks` and `secret-scan / instructions`. Make both required
# status checks.
# The reusable jobs select Ubicloud's managed runner for all callers.
name: secret-scan

on:
  # pull_request_target, so the default branch's copy of this file runs: a pull request
  # cannot change or remove it. Safe because the jobs check out nothing and run no
  # repository code: the commits and one tree are fetched and read as data.
  pull_request_target:
    # edited: a retarget to another base keeps the head commit and changes which commits
    # are the pull request's own, so it must be scanned again. A title or body edit is
    # the same event and is scanned again too, on purpose: a job skipped for it would
    # still post a check on the head commit (`secret-scan`, or `secret-scan / gitleaks`,
    # skipped), newer than the real result. So no job here or in the reusable workflow
    # has a condition on this event.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  # A weekly full-history report (fails only on recent commits) and an on-demand run.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  secret-scan:
    permissions:
      contents: read
    uses: bespokebits/org-workflows/.github/workflows/secret-scan.yml@main
